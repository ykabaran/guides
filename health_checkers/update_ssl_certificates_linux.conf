# Linux nginx certificate updater configuration.
# Use KEY=VALUE with no quotes or spaces around the equals sign.

# No trailing slash.
CERT_SERVER=https://certs.hlss.dev

# Space-separated certificate folders on the distribution server.
CERTS=star_hlss_dev nicoverse_bet_cloudflare

# Space-separated certificates that are allowed to have an empty chain.crt.
# Leave the value empty when every certificate requires a chain.
EMPTY_CHAIN_CERTS=nicoverse_bet_cloudflare

# Certificates are stored under TARGET_BASE/CERTIFICATE_NAME/.
TARGET_BASE=/root/ssl

# nginx is tested before this command is run.
RESTART_CMD=systemctl reload nginx

# Discord notification settings.
NOTIFY_SCRIPT=/root/notify_discord.sh
DISCORD_WEBHOOK_FILE=/root/discord_webhooks/ssl_alerts.txt
