# Windows Tomcat certificate updater configuration.
# Use KEY=VALUE with no quotes or spaces around the equals sign.

# No trailing slash.
CERT_SERVER=https://certs.hlss.dev

# One certificate folder on the distribution server.
CERT=star_slothinteractive_com

# Certificates are stored under TARGET_BASE\CERTIFICATE_NAME\.
TARGET_BASE=C:\Tomcat 9.0\conf

# Windows service name for this Tomcat instance.
TOMCAT_SERVICE=Tomcat9

# Service timing settings, in seconds.
SERVICE_POLL_SECONDS=5
STOP_TIMEOUT_SECONDS=300
FORCE_KILL_WAIT_SECONDS=30

# Discord notification settings.
NOTIFY_SCRIPT=C:\dev\notify_discord.bat
DISCORD_WEBHOOK_FILE=C:\dev\discord_webhooks\ssl_alerts.txt
