port 10178
proto udp4
dev tun

# Certificates
ca ca.crt
cert server.crt
key server.key
dh none
tls-crypt ta.key
crl-verify crl.pem

# Encryption
data-ciphers AES-256-GCM
tls-version-min 1.2

# Tunnel
topology subnet
server 10.8.0.0 255.255.255.0
ifconfig-pool-persist /var/log/openvpn/ipp.txt
client-config-dir ccd 
client-to-client

# Process security
user nobody
group nogroup

# Connection management
keepalive 10 120
persist-key
persist-tun
explicit-exit-notify 1

# Monitoring
status /var/log/openvpn/openvpn-status.log
verb 3