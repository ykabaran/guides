
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

load_module modules/ngx_http_js_module.so;

events {
    worker_connections  1024;
}

http {
    server_tokens off;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    js_import auth1 from njs/auth1.js;
    js_set $stream_upstream_args auth1.upstreamArgs;

    # Do not log query-string credentials or potentially token-bearing Referer URLs.
    log_format main '$remote_addr - $remote_user [$time_local] '
                'host=$host "$request_method $uri $server_protocol" $status $body_bytes_sent '
                '"$http_user_agent" '
                '"$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    proxy_cache_path /var/cache/nginx/hls_cache levels=1:2 keys_zone=hls_cache:10m max_size=2g inactive=10m;

    map $uri $cache_key_uri {
        default $uri;
    }

    map $status $segment_cache_control {
        200 "public, max-age=60";
        206 "public, max-age=60";
        304 "public, max-age=60";
        default "no-store";
    }

    # Origin cache headers must not make error responses enter the shared cache.
    map $upstream_status $segment_no_cache {
        200 0;
        default 1;
    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
