server {
        listen 80;
        server_name ch1.nbmedia.live;

        location / {
                return 301 https://$host$request_uri;
        }

}

server {
        listen 443 ssl;
        server_name ch1.nbmedia.live;

        ssl_certificate /root/ssl/star_nbmedia_live/bundle.crt;
        ssl_certificate_key /root/ssl/star_nbmedia_live/server.key;

        #
        # Note: You should disable gzip for SSL traffic.
        # See: https://bugs.debian.org/773332
        #
        gzip off;

        # Read up on ssl_ciphers to ensure a secure configuration.
        # See: https://bugs.debian.org/765782
        #
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /var/www/nbmedia.live;
        index index.html;

        location = /_verify_token {
                internal;
                js_content auth1.verifyToken;
        }

        location ~ ^/webrtc/(?<company_name>[^/]+)/(?<stream_name>[^/]+)$ {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin $http_origin always;
                    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                    add_header Access-Control-Allow-Headers "Content-Type" always;
                    add_header Access-Control-Max-Age 86400 always;
                    add_header Content-Length 0;
                    add_header Content-Type text/plain;
                    return 204;
                }

                # Snapshot normalized routing identity and original arguments.
                set $auth_company $company_name;
                set $auth_stream $stream_name;
                set $auth_query $args;
                auth_request /_verify_token;
                rewrite ^ /$stream_name? break;

                proxy_hide_header Cache-Control;
                proxy_hide_header Access-Control-Allow-Origin;

                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type" always;
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_set_header Referer "";
                proxy_cache_bypass $http_upgrade;
                proxy_pass http://media.nb.hlsd.com:5119;
        }

        location ~ ^/hls/(?<company_name>[^/]+)/(?<stream_name>[^/]+)/(?<file_name>[^/]+\.m3u8)$ {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin $http_origin always;
                    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                    add_header Access-Control-Allow-Headers "Range" always;
                    add_header Access-Control-Max-Age 86400 always;
                    add_header Content-Length 0;
                    add_header Content-Type text/plain;
                    return 204;
                }

                set $auth_company $company_name;
                set $auth_stream $stream_name;
                set $auth_query $args;
                set $args $stream_upstream_args;
                auth_request /_verify_token;
                rewrite /hls/(.*) /hls_stream/stream/$1 break;

                js_header_filter auth1.clearContentLength;
                js_body_filter auth1.rewritePlaylist buffer_type=string;

                proxy_hide_header Cache-Control;
                proxy_hide_header Content-Type;
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Content-Length;
                proxy_hide_header Etag;
                proxy_hide_header Last-Modified;

                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
                add_header Content-Type "application/vnd.apple.mpegurl" always;
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range" always;

                proxy_http_version 1.1;
                # The playlist body filter requires uncompressed text.
                proxy_set_header Accept-Encoding "";
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_set_header Referer "";
                proxy_pass http://media.nb.hlsd.com;
        }

        location ~ ^/hls/(?<company_name>[^/]+)/(?<stream_name>[^/]+)/(?<file_name>[^/]+\.ts)$ {
                if ($request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin $http_origin always;
                    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                    add_header Access-Control-Allow-Headers "Range" always;
                    add_header Access-Control-Max-Age 86400 always;
                    add_header Content-Length 0;
                    add_header Content-Type text/plain;
                    return 204;
                }

                set $auth_company $company_name;
                set $auth_stream $stream_name;
                set $auth_query $args;
                set $args $stream_upstream_args;
                auth_request /_verify_token;
                rewrite /hls/(.*) /hls_stream/stream/$1 break;

                proxy_cache hls_cache;
                proxy_cache_key "$scheme$proxy_host$cache_key_uri";
                proxy_cache_valid 200 60s;
                proxy_no_cache $segment_no_cache;

                proxy_hide_header Cache-Control;
                proxy_hide_header Content-Type;
                proxy_hide_header Access-Control-Allow-Origin;

                add_header Cache-Control $segment_cache_control always;
                add_header Content-Type "video/mp2t" always;
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range" always;

                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_set_header Referer "";
                proxy_pass http://media.nb.hlsd.com;
        }

        location / {
            try_files $uri /index.html;
        }

}
